<!doctype html>
<html lang="en" class="bg-cream text-espresso">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Parrot</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/js/dashboard.js"></script>
  </head>
  <body class="min-h-screen">
    <div class="mx-auto flex max-w-6xl gap-8 px-6 py-8">
      <aside id="sidebar" class="sticky top-8 hidden h-[calc(100vh-4rem)] w-[220px] shrink-0 flex-col justify-between md:flex"></aside>
      <main class="min-w-0 flex-1">
        <header class="mb-6">
          <h1 class="text-3xl font-bold">Overview</h1>
          <p id="welcome" class="mt-1 text-sm text-roast"></p>
        </header>

        <section id="setup" hidden class="mb-6 rounded-xl border border-mocha bg-foam p-5"></section>

        <section class="mb-6 rounded-xl border border-mocha bg-foam p-5">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm text-roast">Bot status</div>
              <div id="status-label" class="mt-1 text-lg font-semibold">—</div>
            </div>
            <button id="toggle" type="button" hidden
              class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-cream">
              …
            </button>
          </div>
        </section>

        <section class="mb-6 rounded-xl border border-mocha bg-foam p-5">
          <div class="flex items-end justify-between">
            <div>
              <div class="text-sm text-roast">This month</div>
              <div class="text-2xl font-bold">
                <span id="month-answers">—</span>
                <span class="text-base font-medium text-roast">/ <span id="month-limit">—</span> answers</span>
              </div>
            </div>
            <div class="text-xs text-roast">Free tier</div>
          </div>
          <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-mocha">
            <div id="usage-bar" class="h-full bg-accent" style="width: 0%"></div>
          </div>
          <p id="overcap-warning" hidden class="mt-3 text-xs text-accent">
            Free tier limit reached. Pro tier coming soon.
          </p>
        </section>

        <section class="rounded-xl border border-mocha bg-foam p-5">
          <h2 class="mb-4 text-base font-semibold">Today</h2>
          <div id="today-empty" hidden class="text-sm text-roast">
            Once your bot starts answering, you'll see stats here.
          </div>
          <div id="today-stats" hidden>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
              <div>
                <div class="text-xs text-roast">Answers posted</div>
                <div id="today-answers" class="mt-1 text-lg font-semibold">—</div>
              </div>
              <div>
                <div class="text-xs text-roast">Top question</div>
                <div id="today-top-intent" class="mt-1 truncate text-lg font-semibold">—</div>
              </div>
              <div>
                <div class="text-xs text-roast">Active</div>
                <div id="today-active" class="mt-1 text-lg font-semibold">—</div>
              </div>
            </div>
            <div id="today-blocks-wrap" hidden class="mt-5 border-t border-mocha pt-4">
              <div class="mb-2 flex items-center justify-between">
                <div class="text-xs text-roast"><span id="blocks-total">0</span> blocked today</div>
                <a href="/dashboard/activity" class="text-xs text-accent hover:underline">View activity →</a>
              </div>
              <div id="today-blocks" class="flex flex-wrap gap-2"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
